- intent: left_destination_and_arrow_sha
  examples: '- Left destination and arrow shall be the second panel and shall be left
    aligned.'
- intent: right_destination_and_arrow_sh
  examples: '- Right destination and arrow shall be the third panel and shall be right
    aligned.'
- intent: the_arrows_other_than_the_righ
  examples: '- The arrows other than the right angle shall be set at 45 degree.'
- intent: figured_kilometre_if_at_all_gi
  examples: '- Figured kilometre if at all given shall be on the same line and shall
    be at a distance of 3 s/w.'
- intent: the_arrow_shall_also_be_transp
  examples: '- The arrow shall also be transport medium and shall be 16 s/w long and
    8 s/w wide and shall be 2.5 s/w from the border and letterings and shall be placed
    vertically at centre of panel with equal space from top and bottom border.'
