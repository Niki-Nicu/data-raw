- intent: in_urban_areas,_the_“no_parkin
  examples: '- In urban areas, the “No Parking’’ sign is used on the roads to prevent
    any parking of vehicles on the main carriageway which will lead to congestion.
    This sign may be used along with time restriction, indicating morning and evening
    peak periods. The sign shall be placed at the start of the zone till the end of
    the prohibition zone. Signs should be erected within 25 m of the start and end
    of the prohibition. The “No Parking’’ sign shall be placed parallel to kerb facing
    the carriageway and sited approximately at 100 m intervals. Where signs are used
    without road markings, they should be placed strategically rather than at fixed
    intervals. The aim should be that wherever drivers might be tempted to stop, they
    should be able to see the sign. The spacing between consecutive signs, whether
    or not they are on the same side of the road, should be not more than 30 m. The
    sign can be accompanied by arrow showing the direction coupled with change of
    timings and adding of date where required. However, it is to be noted that such
    provision is possible only if the road owning agency resorts to electronic display
    of No Parking Signs by using the Variable Message Sign concept given in IRC: SP-85.
    A “No Parking” sign should be introduced only where there are no other on-street
    parking controls, even if they operate at different times of day. Where other
    controls are required, the “No Parking” sign should be replaced by a prohibition
    of waiting and loading sign provided accordingly (Fig. 14.31).'
