  examples: '- Location and Mounting'
- intent: warning_signs_should_not_be_mo
  examples: '- Warning signs should not be mounted on the same post as a STOP or GIVE
    WAY or terminal speed limit sign, nor mounted on a traffic signal post. When mounted
    with other types of sign, the triangular warning signs should always be mounted
    at the top. Where two or more warning signs are erected together, the sign relating
    to the hazard first encountered should be placed uppermost. When a new sign is
    added to an existing post, it is important to ensure that the correct order is
    maintained, if necessary adjusting the position of the existing signs. The warning
    signs should normally be located depending upon the design Speed (as given in
    Table 15.1) in advance of the hazard warned against. Distances may be increased
    on steep downhill gradients to account for higher speed. Where advance direction
    signs are posted in advance of the intersections, the warning signs relating to
    these junctions could be avoided to eliminate the crowding of signs.'
- intent: left_/_right_curve
  examples: '- Left / Right Curve'
- intent: these_signs_are_to_be_used,_wh
  examples: '- These signs are to be used, whenever there is a need for reduction
    of speed due to change of direction of alignment and radii of the curvature are
    below the specified limit. These signs are intended to warn the driver to reduce
    the speed and proceed cautiously. The warning signs are to be used sparingly.
    If a road has certain curves where vehicles cannot be allowed to negotiate with
    the absolute speed limit or the general operating speed established for the road,
    such curves shall be provided with curve warning signs on both approaches. Supplementary
    plate indicating advisory speed limit can also be provided along with cautionary
    sign considering the level of restriction required on the curve. Ideally if the
    difference between the approach speed to a curve and the safe negotiating speed
    derived based on geometric parameters of curve exceeds 15 Kmph, the curve shall
    be provided with curve warning sign. In the case of sharper curves, it is essential
    to fortify the curve with the applicable type of Chevron Sign i.e. Single or Double
    Chevron signs as per the spacing given in Section'
- intent: 15.65._the_left_hand_curve
