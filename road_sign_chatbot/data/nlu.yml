- intent: all_mandatory_or_regulatory_si
  examples: '- All Mandatory or Regulatory Signs are circular in shape. The exceptions
    in shape are the octagonal red STOP sign and the triangular GIVEWAY or YIELD sign.
    These two signs provide indication about right of way to drivers. Mandatory /
    Prohibitory Signs are to indicate the prohibition upon certain kind of vehicle
    maneuver and vehicle type like “overtaking prohibited” or “U-turn prohibited”
    or “cycles prohibited” and restriction on parking like “parking prohibited” and
    limit on vehicle speed and size like “speed limit” and “maximum load limit”. They
    are'
- intent: with_red_circular_ring_and_dia
  examples: '- with red circular ring and diagonal bars with black symbols or arrows
    or letters on white background. The red ring indicates prohibitory regulation;
    and the diagonal red bar prohibits the action or movement indicated by the black
    symbol.'
- intent: figure_3
  examples: '- Figure 3.1: Example of Mandatory/ Regulatory Signs'
- intent: mandatory_signs_giving_positiv
  examples: '- Mandatory signs giving positive instructions are circular with white
    symbol on a blue background. They indicate what driver must do compulsorily. For
    example, direction'
- intent: control_signs_are_to_compulsor
  examples: '- control signs are to compulsorily regulate certain movements wherever
    the restriction applies.'
- intent: mandatory_and_regulatory_signs
  examples: '- Mandatory and regulatory signs need to be complied with and any violation
    of the rules and regulations conveyed by these signs is a legal offence. Examples
    of these signs are shown in Figure 3.1.'
- intent: cautionary_/_warning_signs
  examples: '- Cautionary / Warning Signs'
- intent: cautionary_/_warning_signs_are
  examples: '- Cautionary / Warning signs are triangular in shape with red border
    and black symbol in white background used to caution and alert the road users
    to potential danger or existence of certain hazardous conditions either on or
    adjacent to the roadway so that they take the desired action. These signs indicate
    a'
- intent: need_for_special_caution_by_ro
  examples: '- need for special caution by road users and may require a reduction
    in speed or some other manoeuvre. Some examples of these signs are Hairpin Bend,
    Narrow Bridge, Gap in Median, School Ahead etc. An example is shown in Figure'
- intent: informatory_/_guide_signs
  examples: '- Informatory / Guide Signs'
- intent: all_guide_signs_and_informator
  examples: '- All guide signs and informatory signs for facilities are rectangular
    in shape. Informatory Signs for facilities indicate location and direction to
    facilities like “fuel station” or “eating place” or “parking” and shall be a symbol
    within a rectangular board with blue background.'
- intent: information_signs_in_rectangul
  examples: '- Information signs in rectangular shape are also used with destination
    names and distances with arrows indicating the direction. The colour pattern of
    direction information sign is presented in Table 8.3. These are used to give such
    information to road users which will help them along the route in the simplest
    and direct manner. Examples of these are shown in Figure 3.3.'
