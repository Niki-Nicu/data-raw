  examples: '- The sign should be used toward the users about the presence of soft
    verges and to alert that driving on the verge might result in the damage of the
    verge or the vehicle becoming stuck (Fig. 15.52).'
- intent: loose_gravel
  examples: '- Loose Gravel'
- intent: the_sign_should_be_used_on_sec
  examples: '- The sign should be used on section of a road on which gravel may be
    thrown up by fast moving vehicles. The sign should be removed immediately after
    the hazard is remedied (Fig. 15.53).'
- intent: slippery_road
  examples: '- Slippery Road'
- intent: the_sign_should_be_erected_to
  examples: '- The sign should be erected to warn that the section of the road ahead
    may be particularly slippery. The sign should be removed immediately after the
    hazard is remedied (Fig. 15.54).'
