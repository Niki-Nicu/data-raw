  examples: '- “BARRIER AHEAD” may be replaced by “TOLL BARRIER AHEAD” (Fig. 15.60).'
- intent: sudden_side_winds
  examples: '- Sudden Side Winds'
- intent: tunnel_ahead_warning
  examples: '- Tunnel Ahead Warning'
- intent: the_sign_is_posted_in_situatio
  examples: '- The sign is posted in situations where the traffic approaches a tunnel
    and the drivers are required to slow down their vehicles for safe travel (Fig.
    15.62).'
- intent: ferry
  examples: '- Ferry'
- intent: the_sign_is_intended_to_warn_t
  examples: '- The sign is intended to warn the drivers about the existence of a ferry
    crossing across a river. It is recommended that pair of signs be used for this
    purpose, one for advance warning located at 200 m from the ferry, and the second
    erected near the ferry. The distance of the second sign from the ferry may be
    50 to 100 m in plain and rolling country and 30 to 60 m in hills depending on
    the design speed (Fig. 15.63).'
- intent: tram_crossing
  examples: '- Tram Crossing'
- intent: falling_rocks
  examples: '- Falling Rocks'
