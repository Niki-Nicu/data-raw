    the Minimum Speed Limit sign shall be installed to indicate the minimum legal
    speed (Fig. 14.53) on an expressway. This shall be used on specific sections to
    avoid the slow moving vehicles acting as a hindrance so as to improve the efficiency
    of the traffic movement on the expressway. It is compulsory to install the “Restriction
    End” sign at the end of the minimum speed limit sign when restriction of minimum
    speed is applied for a section of the road.'
