- intent: the_"transport_medium"_font_sh
  examples: '- The "Transport Medium" font shall be used for English and "Hindi7"
    or “Narad” for Hindi and for regional language it shall be as per local practice.
    The arrows for directions boards shall also be taken from "Transport Medium" font.
    The height of lettering for design of direction sign shall be taken from Table
    12.1 for the speed of the road in which the sign is to be placed.'
