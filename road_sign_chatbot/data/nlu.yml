- intent: type_iv_high_intensity_micro-p
  examples: '- Type IV High intensity micro-prismatic grade sheeting (HIP)'
- intent: this_sheeting_shall_be_of_high
  examples: '- This sheeting shall be of high intensity retro-reflective sheeting
    made of micro- prismatic retro-reflective element material coated with pressure
    sensitive adhesive. The retro-reflective surface after cleaning with soap and
    water and in dry condition shall have the minimum co-efficient of retro-reflection
    (determined in accordance with ASTM: D4956) as indicated in Table 6.6.'
- intent: minimum_coefficient_of_retro-r
  examples: "- Minimum Coefficient of Retro-reflection (RA)(cd.lx-1.m-2).\t(Source:\
    \ ASTM: D4956)"
