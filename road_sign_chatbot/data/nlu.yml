- intent: variable_message_signs
  examples: '- Variable Message Signs'
- intent: variable_message_signs_(vms)_a
  examples: '- Variable Message Signs (VMS) are electronic traffic signs often used
    on roadways to give travellers information about current travel conditions, special
    events, etc. Such signs warn the road users of traffic congestion, road crashes,
    incidents, roadwork zones, or speed limits on a specific highway segment. The
    use of VMS boards which are constantly updated based on the prevailing traffic
    conditions from Traffic Management Centre (TMC) can suggest the road users to
    take alternative routes, limit travel speed, warn of location of the incidents
    or just inform of the traffic conditions. A common technology used in new installations
    for variable message signs are LED'
- intent: displays
  examples: '- displays. In recent years, some newer LED variable message signs have
    emerged which has the ability to display coloured text and graphics. They are
    commonly installed on an overhead gantry structure or a cantilever structure.
    It is fully- programmable, customizable solution specific to the location for
    the benefit of users. The information displayed is real-time dynamic information
    as well as static information controlled automatically via a central server. It
    is designed to affect motorist''s behaviour to improve traffic flow and enhance
    the driving experience of motorists on roads. The information displayed include:'
