  examples: '- Class C (Micro prismatic grade sheeting)'
- intent: type_viii_micro_prismatic_grad
  examples: '- Type VIII Micro prismatic grade sheeting'
- intent: retro-reflective_sheeting_is_t
  examples: '- Retro-reflective sheeting is typically manufactured as a cube corner.
    The reflective sheeting shall be retro-reflective sheeting made of micro prismatic
    retro-reflective material. The retro-reflective surface, after cleaning with soap
    and water and in dry condition shall have the minimum co-efficient of retro-reflection
    (determined in accordance with ASTM: D 4956) as indicated in Table 6.7.'
- intent: at_the_end_of_10_years,_the_sh
  examples: '- At the end of 10 years, the sheeting used shall retain at least 80
    percent of the retro- reflectance values presented in Table 6.7.'
- intent: type_ix_micro_prismatic_grade
  examples: '- Type IX Micro prismatic grade sheeting'
- intent: minimum_co-efficient_of_retro-
  examples: "- Minimum Co-efficient of Retro-reflection (RA) (cd.lx-1.m-2).\t(Source:\
    \ ASTM: D4956)"
- intent: type_xi_micro_prismatic_grade
  examples: '- Type XI Micro prismatic grade sheeting'
- intent: adhesives
  examples: '- Adhesives'
- intent: the_sheeting_shall_have_a_pres
  examples: '- The sheeting shall have a pressure-sensitive adhesive of the aggressive-tack
    type requiring no heat, solvent or other preparation for adhesion to a smooth
    clean surface, in a manner recommended by the sheeting manufacturer. The adhesive
    shall be protected by an easily removable liner (removable by peeling without
    soaking in water or other solvent) and shall be suitable for the type of material
    of the base plate used for the sign. The adhesive shall form a durable bond to
    smooth, corrosion and weather resistant surface of the base plate such that it
    shall not be possible to remove the sheeting from the sign base in one piece by
    use of sharp instrument. The sheeting shall be applied in accordance with the
    manufacturer’s specifications.'
- intent: fabrication
  examples: '- Fabrication'
- intent: surface_to_be_reflectorized_sh
  examples: '- Surface to be reflectorized shall be effectively prepared to receive
    the retro-reflective sheeting. The aluminium sheeting shall be de-greased either
    by acid or hot alkaline etching and all scale/dust removed to obtain a smooth
    plain surface before the application of retro-reflective sheeting. If the surface
    is rough, approved surface primer may be used. After cleaning, metal shall not
    be handled, except by suitable device or clean canvas gloves, between all cleaning
    and preparation operation and application of reflective sheeting/ primer. There
    shall be no opportunity for metal to come in contact with grease, oil or other
    contaminants prior to the application of retro-reflective sheeting. Complete sheets
    of the material shall be used on the signs except where it is unavoidable. Signs
    with a side dimension up to 1200 mm shall not have any joints (splices) in the
    base retro reflective sheeting and in the substrate. At splices, sheeting with
    pressure-sensitive adhesives shall be overlapped not less than 5'
- intent: mm._where_screen_printing_with
  examples: '- mm. Where screen printing with transparent colours is proposed, only
    butt joint shall'
- intent: be_used
  examples: '- be used. The material shall cover the sign surface evenly and shall
    be free from twists, cracks and folds. Cut-outs to produce legends and borders
    shall be bonded with the sheeting in the manner specified by the manufacturer.'
- intent: messages_/_borders
  examples: '- Messages / Borders'
- intent: the_messages_(legends,_letters
  examples: '- The messages (legends, letters, numerals, etc.) and borders shall either
    be screen- printed or cut out from durable transparent overlay or cut-out from
    the same type of reflective sheeting or digitally printed for the cautionary and
    mandatory sign boards on top of the base retro reflective sheeting which should
    be covering the entire sign facia (end to end) of the substrate. Either screen
    printing or digitally printing shall be processed and finished with materials
    in a manner specified by the sheeting manufacturer. In the case of informatory
    sign boards (including tourism related sign boards), the messages (legends, letters,
    numerals etc.) and borders shall be cut-out from durable transparent overlay film
    or cut-out from the same reflective sheeting or digitally printed. Such cut-outs
    shall be made from durable transparent overlay materials as specified by the sheeting
    manufacturer and shall be bonded with the sheeting in the manner specified by
    the manufacturer. Whenever transparent overlay film is used for making any type
    of sign, the coloured portion of sign shall have coefficient of reflectivity not
    less than the reflectivity of type and colour of sheeting normally used which
    are given in Table 6.3 to 6.9. Cut-out messages and borders, wherever used, shall
    be either made out of retro-reflective sheeting or made out of durable transparent
    overlay except those in black which shall be of opaque in the case of durable
    transparent overlay.'
- intent: in_the_case_of_screen_printed
  examples: '- In the case of screen printed transparent coloured areas on white sheeting,
    the coefficient of retro reflection shall not be less than 50 percent of the values
    of corresponding colour given in Table 6.3 to 6.9. In the case of digitally printing,
    the signs shall be manufactured using a system of matched components of reflective
    sheeting and overlay films and digital inks manufactured and supplied by the reflective
    sheeting manufacturer. The digital printer and digital ink shall be approved by
    the reflective sheeting manufacture. Digitally printed traffic colour (red, blue,
    green, yellow, orange and brown) areas on white sheeting shall not be having less
    than 70 percent of the value of the coefficient of retro reflection established
    for its colour and type of sheeting as given in Table 6.3 to 6.9.'
- intent: initial_colour_shall_meet_the
  examples: '- Initial colour shall meet the daytime and nighttime colour limits as
    defined in the effective version of ASTM: D4956. Printed traffic colours shall
    also meet the accelerated outdoor weathering and colour fastness requirements
    as per ASTM: D4956. Digitally printed black copy shall remain sufficiently opaque
    for its intended use for the warranty period of the base sheeting. Digitally printing
    of custom colours shall have documented sheeting manufacturer warranty, stating
    that custom colours do not excessively fade, discolour, crack, craze, peel, blister
    or lose reflectivity such that the signs become functionally unsuitable for their
    intended purpose during the warranty period of the base sheet. Finished signs
    shall have an Ultra Violet (UV) protective clear overlay applied to the entire
    face of the sign supplied by the reflective'
- intent: sheeting_manufacturer
  examples: '- sheeting manufacturer. Overlay and digital inks shall be part of a
    matched component system as recommended by the retro-reflective sheeting manufacturer.
    Completed printed surface shall be free of bubbles, blemishes, streaks or spotted
    areas. In the case of Chevron signs and Object Hazard Markers, full sign facia
    shall be covered with retro reflective sheeting and the patterns shall be made
    with either black overlay film or screen printing or digital printing.'
- intent: warranty_and_durability
  examples: '- Warranty and Durability'
- intent: the_contractor_shall_obtain_fr
  examples: '- The Contractor shall obtain from the manufacturer of the reflective
    sheeting a ten year warranty for satisfactory field performance including stipulated
    retro-reflectance of the retro-reflective sheeting for micro-prismatic Class C
    grade sheeting, seven years for Class B grade sheeting, five years for Class A
    grade sheeting and submit the same to the Engineer in charge. The warranty shall
    be inclusive of the screen printed or cut out letters/legends and their bonding
    to the retro-reflective sheeting. Warranty document shall be in original having
    a unique number with date and shall be addressed to the engineer in charge with
    the project details including details of the sign boards installed. Warranty issued
    by any party other than the sheeting manufacturer shall not be accepted. Contractor/
    supplier should furnish the lot numbers and certification that the signs and materials
    supplied against the assigned work meets all the stipulated requirements and carry
    the stipulated warranty and that the contractor/supplier is the authorized converter
    of the particular sheeting. As a part of source approval (to assure the quality
    of product prior to supply), contractor shall obtain from the manufacturer of
    sheeting a prequalification warranty certificate stating that the material they
    are offering will have the warranty as mentioned above and the certificate shall
    be submitted to the Engineer in charge. In the case of digital printed sign boards,
    the coefficient of retro reflection after the stipulated warranty period shall
    be minimum 80 percent of the initial value of the printed sign. Match component
    system warranty for the components like retro-reflective sheeting, overlay films
    and digital inks shall be provided by the manufacturer.'
- intent: posts_and_mountings_for_signs
  examples: '- Posts and Mountings for Signs'
- intent: the_traffic_signs_shall_be_mou
  examples: '- The traffic signs shall be mounted on support posts, which shall be
    made of either Mild Steel (MS) or Galvanized Iron (GI) pipes conforming to IS
    1239, Circular Hollow Section conforming to IS 1161, Rectangular Hollow Section
    conforming to IS 4923 or Square Hollow Section conforming to IS 3589. In the case
    of signs supported on two or more posts, if necessary, bracing may also be provided.
    Sign posts, their foundations and sign mountings shall be so constructed as to
    hold these in a proper and permanent position against the normal storm wind loads
    or displacement by vandalism. Normally, signs with an area up to 0.9 square metre
    shall be mounted on a single post, and for greater area, two or more supports
    shall be provided. Sign post/ support end(s) shall be firmly fixed to the ground
    by means of properly designed concrete foundation. The work of foundation shall
    conform to relevant specifications.'
- intent: all_components_of_signs_and_su
  examples: '- All components of signs and supports including all nuts and bolts,
    other than the reflective portion of GI posts shall be thoroughly descaled, cleaned,
    primed and painted with two coats of epoxy paint or powder coating. Any part of
    mild steel (MS) post below ground shall be painted with three coats of redoxide
    paint.'
- intent: except_in_the_case_of_railway
  examples: '- Except in the case of railway level crossing signs (for which the colour
    scheme is given in Section 15.71) the sign posts shall be painted in 250 mm wide
    bands, alternately black and white. The lowest band next to the ground shall be
    in black.'
- intent: the_signs_shall_be_fixed_to_th
  examples: '- The signs shall be fixed to the posts by welding in the case of steel
    posts and by bolts and washers of suitable size in the case of reinforced concrete
    or GI posts. After the nuts have been tightened, the tails of the bolts shall
    be furred over with a hammer to prevent removal.'
- intent: for_overhead_signs,_the_suppor
  examples: '- For overhead signs, the support system should be properly designed
    based on sound engineering principles, to safely sustain the dead load, live load
    and wind load on the completed sign system. For this purpose, the overhead signs
    shall be designed to withstand a wind loading of 150 kg/m² normal to the face
    of the sign and 30 kg/ m² transverse to the face of the sign. In addition to the
    dead load of the structure, walkway loading of 250 kg concentrated live load shall
    also be considered for the design of the overhead sign structure.'
- intent: colour_for_signs
  examples: '- Colour for Signs'
- intent: signs_shall_be_provided_with_r
  examples: '- Signs shall be provided with retro-reflective sheeting and/or overlay
    film as shown on the detailed drawings. The reverse side of all signs shall be
    painted grey.'
- intent: the_colour_of_the_material_sha
  examples: '- The colour of the material shall be located within the area defined
    by the chromaticity coordinates in Table 8.1 and comply with the luminance factor
    given in Table 8.2 when measured as per ASTM: D 4956. Chromaticity is the objective
    specification of the quality of a colour regardless of its luminance, that is,
    as determined by its hue and colourfulness (or saturation, chroma, or intensity)'
- intent: the_colours_shall_be_durable_a
  examples: '- The colours shall be durable and uniform in acceptable hue when viewed
    in day light or under normal headlights at night.'
- intent: the_mandatory_and_warning_sign
  examples: '- The mandatory and warning signs shall be provided with white background
    and red border. The legend/symbol for these signs shall be in black.'
- intent: colour_pattern_for_direction_i
  examples: '- Colour pattern for direction information signs is given in Table 8.3.'
- intent: the_colours_chosen_for_informa
  examples: '- The colours chosen for informatory or guide signs shall be distinct
    for different categories of roads. For various categories of road in India, following
    colour pattern shall be used for direction information sign as given in Table
    8.3.'
- intent: table_8
  examples: '- Table 8.1: Chromaticity Coordinates for Different Colours'
- intent: colour_specification_limitsda
  examples: '- Colour Specification Limits(Daytime)A'
- intent: a_the_four_pairs_of_chromatici
  examples: '- A The four pairs of chromaticity coordinates determine the acceptable
    colour in terms of the CIE 1931 Standard Colorimetric System measured with CIE
    Standard Illuminant D65.'
- intent: b_the_saturation_limit_of_gree
  examples: '- B The saturation limit of green and blue may extend to the border of
    the CIE chromaticity locus for spectral colours.'
- intent: colour_specification_limits_n
  examples: '- Colour Specification Limits (Nighttime)A'
- intent: performance_defined_for_the_m
  examples: '- *Performance defined for the metallic portion is applicable only to
    Type V grade retro reflective sheeting as per ASTM: D4956'
- intent: size_of_signs
  examples: '- Size of Signs'
- intent: as_a_general_rule,_there_shall
  examples: '- As a general rule, there shall be four sizes (600 mm, 750 mm, 900 mm
    and 1200 mm) of signs for mandatory / regulatory and cautionary / warning signs.
    In the case of Expressways having design speed in excess of 120 Kmph, sign size
    of 1500 mm shall be used for the cautionary and regulatory signs. For certain
    categories of mandatory / regulatory signs, smaller diameter of 300 mm boards
    can be used in conjunction with traffic light signals or on bollards on traffic
    islands.'
- intent: general_dimensions_of_differen
  examples: '- General dimensions of different categories of signs are given in the
    respective sections.'
- intent: definition_plates_supplement
  examples: '- Definition Plates / Supplementary Plates'
- intent: where_the_competent_authority
  examples: '- Where the competent authority considers it advisable to make the meaning
    of a sign or symbol more explicit, or in the case of mandatory signs to limit
    their application to certain categories of road users or to specific periods,
    an inscription shall be placed below the sign in a rectangular definition plate
    of suitable size. The definition plate shall be with retro-reflective white background
    and black letters and black border 20 mm wide. Numerals shall be inscribed in
    international form of Indian numerals and word messages shall be in English and/or
    other languages as necessary. To contain the size of the sign, the number of languages
    on the signs shall normally be limited to two. An example of definition plate
    with design elements is given in Plate-III (Fig. 16.17).'
- intent: visibility_of_signs
  examples: '- Visibility of Signs'
- intent: in_order_to_make_signs_more_vi
  examples: '- In order to make signs more visible and legible at night, in particular
    cautionary/warning signs and regulatory signs shall be provided with reflective
    sheeting. Care should, however, be taken that this does not result in road users
    becoming dazzled.'
- intent: it_is_essential_that_drivers_a
  examples: '- It is essential that drivers and other road users have an unobstructed
    view of road signs. The distance which should be kept clear of obstructions to
    the sight line, whether caused by vegetation (e.g. bushes, trees), other signs
    or street furniture (e.g. crash barriers), is known as the clear visibility distance.
    The higher the prevailing traffic speeds, the greater this distance needs to be.'
- intent: backing_board_and_use_of_fluor
  examples: '- Backing Board and Use of Fluorescent Colour for Pedestrian Crossing'
- intent: design
  examples: '- Design'
- intent: to_improve_conspicuity_against
  examples: '- To improve conspicuity against a complex or dark background, a sign
    may be mounted on a yellow backing board as shown in Figure 10.1. A backing board
    can also be used for a neater assembly, e.g. when a sign requires a supplementary
    plate, and also eliminates the risk of the plate becoming misaligned. A yellow
    backing board must be rectangular or'
- intent: square_in_shape
  examples: '- square in shape. A backing board must not'
- intent: itself_be_provided_with_a_bord
  examples: '- itself be provided with a border, nor give the impression of being
    an additional border.'
- intent: there_are_potential_disadvanta
  examples: '- There are potential disadvantages to the use of'
- intent: figure_11
  examples: '- Figure 11.1: Backing Board with Fluorescent Yellow Colour for Pedestrian
    Crossing'
- intent: backing_boards
  examples: '- backing boards. The larger overall size of the assembly can sometimes
    obstruct sight lines. A backing board can deprive triangular signs of a primary
    recognition aid and their distinctive silhouette. Yellow backing boards are environmentally
    intrusive, and their over-use could eventually devalue their attention-attracting
    benefits. A less garish way of increasing a sign’s conspicuity is simply to provide
    a standard sign of larger size. Not only will this be more noticeable than a smaller
    sign, but it will also improve legibility and hence reading distance, which a
    yellow backing board cannot.'
- intent: warrants_for_using_backing_boa
  examples: '- Warrants for Using Backing Boards'
- intent: when_all_other_normal_treatmen
  examples: '- When all other normal treatments have been tried (e.g. larger signs
    and upgraded delineation) and still a higher-than-expected crash rate is experienced,
    only then should the use of a yellow backing board be considered. They should
    be used very sparingly as a special case and not as a matter of course. It may
    also be fluorescent; this greatly increases conspicuity in dull weather and at
    dusk. Fluorescence can be particularly effective in drawing attention to signs
    mounted in deep shadow, e.g. below overhanging trees or in places affected by
    dull or foggy weather conditions. In summary, yellow backing board or fluorescence
    are somewhat visually intrusive and hence should be used with discretion.'
- intent: size_of_letters
  examples: '- Size of Letters'
- intent: letter_size_should_be_chosen_c
  examples: '- Letter size should be chosen considering the design speed, classification
    and sign location on the road, so that the sign is of adequate size for legibility
    but without being too large or obtrusive. The size of the letter, in terms of
    x-height, to be chosen as per the design speed (considering Legibility Index of
    45) is given in Table 12.1.'
- intent: letter_size_on_definition_plat
  examples: '- Letter size on definition plates attached with signs with dimension
    greater than or equal to 900 mm should be 50 mm or 100 mm, and in the case of
    signs with dimensions less than 900 mm, it should be 50 mm. Where the message
    is long, as for instance in “NO PARKING” and “NO STOPPING & NO STANDING” signs,
    the message may be broken in to two lines and the size of letters may be varied
    in the lines so that the definition plate is not too large. The lettering on definition
    plates will be all in upper case letters. Example for Definition Plate is given
    in Plate-III (Fig. 16.17).'
- intent: table_12
  examples: '- Table 12.1: Letter Size and Siting of Information Signs (Shoulder &
    Overhead Mounted)#'
- intent: note:_where_there_are_site/spa
  examples: '- Note: Where there are site/space constraints, 80 percent of the values
    shall be adopted for x height # Derived from the first principle presented in
    Annexure VI'
- intent: 'notes:'
  examples: '- Notes:'
- intent: for_grade_separated_junction,
  examples: '- For grade separated junction, two or three advance direction signs
    are to be provided. These shall be located at the start of diverging lane, 250
    m to 750 m from the exit and additionally 750 m to 1500 m from the exit.'
- intent: the_“x”_height_is_the_height_o
  examples: '- The “x” height is the height of a lower case English “Transport Medium”
    font and upper'
- intent: case_shall_be_1
  examples: '- case shall be 1.4 times of lower case height.'
- intent: in_columns_2,_3,_7,_8,_10_and
  examples: '- In columns 2, 3, 7, 8, 10 and 11 of Table 12.1 the font heights shown
    are normal size to be used for respective approach speeds and in brackets are
    the absolute minimum sizes to be used where site/ space is limited. The font size
    can be increased by another 20 percent from the normal font size for those direction
    boards requiring special emphasis/ attention.'
- intent: in_columns_4_and_9_of_table_12
  examples: '- In columns 4 and 9 of Table 12.1, the clear visibility distances indicated
    are minimum values. Greater distances should be provided wherever possible.'
- intent: in_columns_5_and_6_table_12
  examples: '- In columns 5 and 6 Table 12.1, the distances shown are for guidance
    only and are not to be taken precise.'
- intent: reassurance_signs_shall_normal
  examples: '- Reassurance Signs shall normally be placed about 100-150m after the
    junction. Place Identification Signs are normally placed about 90m to 150m in
    advance of the start of the built-up area and flag type direction signs are generally
    installed at the nose of diverging lanes.'
- intent: columns10,_11_and_12_of_table
  examples: '- Columns10, 11 and 12 of Table 12.1 shall be taken for design of overhead
    signs.'
- intent: maintenance_of_signs
  examples: '- Maintenance of Signs'
- intent: prior_to_installing_any_road_s
  examples: '- Prior to installing any road sign, the responsibility for the maintenance
    of the sign and the post is required to be decided, and the timing plan(s) should
    be clearly established. Over time, signs become faded and their retro-reflective
    properties diminish. This reduces both conspicuity and legibility, by day and
    by night. Excessively discoloured or faded signs (e.g. white backgrounds which
    have become grey or brown, or red borders faded to pink) and signs, where the
    legend or graphic is peeling off cannot be fully effective and need to be replaced
    immediately. The signs along with the posts shall be maintained in proper position,
    and kept clean and legible at all times. Signs should be cleaned at intervals
    appropriate to the site conditions. Signs at locations where they are subject
    to heavy soiling from passing traffic, or algae growth (a common problem with
    signs beneath tree canopies) will need more frequent cleaning.'
- intent: a_reference_number_along_with
  examples: '- A reference number along with the type of sheeting, Manufacturer name,
    month and year of installation should be placed on the back of a sign in a contrasting
    colour or by indelible marking in characters not exceeding 50 mm in height. Additionally,
    a 2D Bar code (Quick Response (QR) Code) should be placed on the back side of
    the sign board with an indelible ink. The details like type of sheeting, manufacturer
    name, month and year of installation, project details etc. can be fed into this
    bar code. The size of such bar codes shall be restricted to 2 * 2 inches i.e.
    51 mm * 51 mm and placed at the bottom (either left or right) depending on the
    location and type of sign. A typical format is given in Annexure-VII.'
- intent: all_signs_shall_be_visually_in
  examples: '- All signs shall be visually inspected at least twice a year both in
    day and night times and at least once a year in the rain. Performance of all the
    signs should be evaluated with retro reflectometer at an interval of every two
    years. All signs should be replaced either at the end of warranty period of the
    retro-reflective sheeting used on the sign or if the reflectivity of the sheet
    goes below 80 percent of the initial reflectivity given in Table 6.3 to 6.9. Damaged
    signs shall be replaced immediately. Recording format for periodic testing of
    Retro reflectivity is mentioned in Annexure-VIII.'
- intent: the_authorities_responsible_fo
  examples: '- The authorities responsible for the road signs should maintain a schedule
    of painting of the posts and non-reflective area of signs periodically. It is
    recommended that painting of the signs (where applicable) may be undertaken after
    every two years. In case of overhead signs, adequate provision is to be made to
    have access to the signs for the purpose of maintenance activities. This must
    be ensured at the time of installation. Special care shall be taken to see that
    weeds, shrubbery, mud, etc. are not allowed to obscure any sign.'
- intent: in_addition_to_the_painting_of
  examples: '- In addition to the painting of the posts of shoulder mounted sign boards,
    alternate white and yellow bands measuring 50 mm long retro-reflective sheeting
    shall be pasted around them which would help in ensuring the visibility / presence
    of poles during nighttime even if the sign boards are stolen or totally vandalized.
    Three to four bands of such retro-reflective sheeting shall be pasted starting
    from a height of 0.5 m above the ground level.'
- intent: mandatory/_regulatory_signs
  examples: '- Mandatory/ Regulatory Signs'
- intent: the_detailed_dimensioned_drawi
  examples: '- The detailed dimensioned drawings of 900 mm sized sign and symbols
    thereon are shown in Plate-I for ease of reproduction. For signs of other sizes,
    the symbols should be proportionately reduced or enlarged. The mandatory/regulatory
    signs are listed in Annexure -I. These are classified under the following sub-heads
    keeping in view their design and application:'
- intent: “stop”_and_“give_way”_signs_(r
  examples: '- “Stop” and “Give Way” signs (Right of way signs)'
- intent: “prohibitory”_signs
  examples: '- “Prohibitory” signs'
- intent: “no_parking”_and_“no_stopping”
  examples: '- “No Parking” and “No Stopping” signs'
- intent: “speed_limit”_and_“vehicle_con
  examples: '- “Speed Limit” and “Vehicle Control” signs'
- intent: “restriction_ends”_sign,_and
  examples: '- “Restriction Ends” sign, and'
- intent: “compulsory_direction_control”
  examples: '- “Compulsory Direction Control” and other signs'
- intent: regulatory_signs_that_indicate
  examples: '- Regulatory signs that indicate the beginning of a restriction or prohibition
    and to which direction it applies have to be placed in accordance with that direction.
    The requirement is that the signs must be placed on each side of the road or on
    each side of the appropriate carriageway of a dual carriageway road; excepting
    that, signs need to be placed only on one side if any of the following circumstances
    apply:'
- intent: where_the_restriction,_require
  examples: '- where the restriction, requirement or prohibition applies only to one
    side of the road.'
- intent: at_a_junction_where_traffic_tu
  examples: '- at a junction where traffic turns from a one-way road into the relevant
    road. The sign should be angled to face towards the driver.'
- intent: at_a_junction_where_the_carria
  examples: '- at a junction where the carriageway of the relevant road is less than
    5 m wide and the centre of the sign is no more than 2 m from the edge of the carriageway.'
- intent: from_the_center_of_most_disadv
  examples: '- from the center of most disadvantaged driving lanes. The more the number
    of signs which drivers are presented with simultaneously, the greater the difficulty
    they are likely to have in assimilating the information. Generally, not more than
    two signs should be erected on any one post when intended to be read from an approaching
    vehicle and this applies when signs are mounted at the same location on separate
    posts. Terminal speed limit signs should be mounted alone. When a sign needs supplementary
    plate, the combination of sign and plate may be regarded as one sign.'
- intent: stop_sign
  examples: '- STOP Sign'
- intent: purpose
  examples: '- Purpose'
- intent: this_is_for_indicating_priorit
  examples: '- This is for indicating priority for the right of way. The sign is intended
    for use only on the Minor Road intersecting with Major Road where traffic is required
    to stop before entering a major road. It is intended to communicate through this
    sign that the vehicle shall proceed past the stop line only after ascertaining
    that this will not cause danger to traffic on the main road. This is a Mandatory
    / Regulatory sign (Fig. 14.01).'
- intent: combination_with_markings
  examples: '- Combination with markings'
- intent: the_stop_sign_shall_always_be
  examples: '- The stop sign shall always be used in combination with certain road
    markings, such as stop line and the word “STOP” marked on the pavement vide IRC:
    35 “Code of Practice for Road Markings”.'
- intent: size,_shape_and_colour
  examples: '- Size, shape and colour'
- intent: the_sign_(shown_in_fig
  examples: '- The sign (shown in Fig. 14.01) shall be octagonal in shape and shall
    have red background and white border. The word “STOP” shall be written in white
    (in English or local language) and centrally positioned. The height of the octagon
    and border shall be as per Table 14.1.'
- intent: table_14
  examples: '- Table 14.1: Sizes and Dimensions of ‘STOP’ signs'
