  examples: '- Material for Signs'
- intent: the_various_materials_and_fabr
  examples: '- The various materials and fabrication of road signs shall conform to
    the following requirements:'
- intent: concrete
  examples: '- Concrete'
- intent: concrete_shall_be_of_m25_grade
  examples: '- Concrete shall be of M25 grade for foundation.'
- intent: reinforcing_steel
