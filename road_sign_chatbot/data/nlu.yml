  examples: '- Cattle Crossing'
- intent: wild_animals_likely_to_be_on_r
  examples: '- Wild Animals likely to be on Road Ahead'
- intent: queues_likely_ahead
  examples: '- Queues Likely Ahead'
- intent: low_flying_aircraft
  examples: '- Low Flying Aircraft'
- intent: this_sign_is_for_use_on_roads
  examples: '- This sign is for use on roads skirting or in the vicinity of airfields
    / airports where road users are likely to be startled by low-flying aircraft or
    by sudden noise from aircraft. It will be usually more effective for this sign
    to be sited further in advance of the flight path (50-100m), accompanied by a
    distance plate as an aircraft might be virtually overhead before a driver sees
    the sign (Fig. 15.69).'
- intent: unguarded_railway_crossing
  examples: '- Unguarded Railway Crossing'
- intent: the_sign_should_be_used_on_the
  examples: '- The sign should be used on the approaches of railway level crossings
    where there are no gates or other barriers. A pair of signs shall be used for
    the purpose: (i) an advance warning sign located at 200 m away from the crossing
    and (ii) a second sign to be erected near the crossing. The distance of the second
    sign from the crossing may be 50-100 m in plain and rolling terrain and 30-60
    m in hilly terrain (Fig. 15.70). A rectangular white plate with one or two red
    bands as shown in Fig. 15.70, shall be provided at the bottom of the sign.'
- intent: guarded_railway_crossing
  examples: '- Guarded Railway Crossing'
- intent: the_sign_should_be_used_to_war
  examples: '- The sign should be used to warn traffic on the approaches to guarded
    railway crossings. A pair of signs shall be used for the purpose (i) an advance
    warning sign located at 200 m away from the crossing and (ii) a second sign to
    be erected near the crossing. The distance of the second sign from the crossing
    maybe 50-100 m in plain and rolling terrain and 30-60 m in hilly terrain (Fig.
    15.71). A rectangular white plate with one or two red bands as shown in Fig. 15.71,
    shall be provided at the bottom of the sign.'
- intent: crash_prone_area_ahead_sign
  examples: '- Crash Prone Area Ahead Sign'
- intent: the_sign_should_be_used_on_app
  examples: '- The sign should be used on approach of identified crash prone locations
    (Fig. 15.72). However, the road owning agency should take necessary steps to improve
    the safety at such locations and remove this sign after that. This implies that
    the placement of the sign shall serve as a stop gap arrangement till the improvement
    of such accident prone locations.'
- intent: u_turn_ahead_sign
  examples: '- U Turn Ahead Sign'
- intent: the_sign_shall_be_placed_about
  examples: '- The sign shall be placed about 80 to 100 m before to warn the traffic
    about the presence of U turning facility and that drivers are required to slow
    down their vehicles for safe travel. A supplementary board (written in English
    or vernacular language) can be used to notify the road users about U-turn facility
    ahead (Fig 15.73).'
- intent: chevron_signs
  examples: '- Chevron Signs'
- intent: at_the_curved_alignment_of_a_r
  examples: '- At the curved alignment of a roadway, the chevron signs shall be used
    to inform the drivers about sharpness of curve. The chevron sign shall be a vertical
    rectangle and shall be installed always on the outside of a turn or curve, in
    line with and at approximately right angle to approaching traffic. Use of a single
    chevron sign for treating a curve should be avoided. Spacing of chevron signs
    should be such that the'
- intent: road_user_always_has_at_least
  examples: '- road user always has at least two signs in view, until the change in
    alignment eliminates the need for the sign as given in Table 15.2. Chevron signs
    should be visible for a sufficient distance to provide the road user with adequate
    time to react to the change in alignment.'
- intent: '*if_deflection_angle_is_greate'
  examples: '- *If deflection angle is greater than 200 for curves with radius up
    to 1200 m'
- intent: depending_upon_the_sharpness_o
  examples: '- Depending upon the sharpness of curve, Single Chevron sign (Fig. 15.74),
    Double Chevron sign (Fig 15.76) and Triple Chevron sign (Fig 15.77) can be installed.
    When the deflection angle is greater than 90 degree, double chevron signs shall
    be used. Triple chevron sign shall be essentially used at the hairpin bends, loops
    of the interchanges and preferred at central islands of a roundabout. If the Single
    Chevron signs are preferred to be used for roads operating at or more than 100
    Kmph, bigger size of 750 mm x 900 mm (refer Fig. 15.75) shall be used.'
- intent: hazard_marker
  examples: '- Hazard Marker'
- intent: roadside_hazard_like_bridges,
  examples: '- Roadside hazard like bridges, trees which are coming in the roadway
    are to be illuminated by retro reflective Object Hazard Markers (OHM) and for
    a left side hazard (Fig. 15.78) shall be used and for a right side hazard (Fig.
    15.79) shall be used. If traffic is allowed to pass on either side of the triangular
    island, two-way Object Hazard Marker (Fig. 15.80) shall be used.'
- intent: informatory_signs
  examples: '- Informatory Signs'
- intent: the_signs_illustrated_in_this
  examples: '- The signs illustrated in this section give information to the road
    user regarding their location or facilities available in the vicinity or about
    the destination. The detailed dimensioned drawings for direction information signs
    with guidance for design are shown in Plate-III and design principles are presented
    in Annexure-III. For facility information signs 600 mm x 800 mm sizes are shown
    in Plate-IV and signs of other'
- intent: sizes_the_symbols_should_be_pr
  examples: '- sizes the symbols should be proportionately reduced or enlarged. The
    facility information signs are listed in Annexure-IV.'
- intent: the_signs_are_classified_under
  examples: '- The signs are classified under the following sub-heads keeping in view
    their design and application:'
- intent: direction_and_place_identifica
  examples: '- Direction and Place Identification signs'
- intent: facility_information_signs
  examples: '- Facility Information signs'
- intent: other_useful_information_signs
  examples: '- Other Useful Information Signs'
- intent: parking_signs,_and
  examples: '- Parking Signs, and'
- intent: flood_gauge
  examples: '- Flood Gauge'
- intent: the_following_are_the_function
  examples: '- The following are the functions of the direction signs:'
- intent: it_should_give_drivers_advance
  examples: '- It should give drivers advance information of their approach to a junction.'
- intent: it_should_indicate_the_type_of
  examples: '- It should indicate the type of junction.'
- intent: it_should_inform_them_of_the_d
  examples: '- It should inform them of the destinations that may be reached from
    each exit.'
- intent: it_should_identify_the_route_a
  examples: '- It should identify the route and indicate its status within network.'
- intent: shape,_colour_and_language_of
  examples: '- Shape, colour and language of inscription'
- intent: these_signs_shall_be_rectangul
  examples: '- These signs shall be rectangular. However, direction signs may be in
    the shape of an elongated rectangle with the longer side horizontal, terminating
    in an arrowhead. The colour pattern for direction signs are given in Table 8.3
    and size of the letters shall be as per Table 12.1. The English font shall be
    “Transport Medium” and Hindi shall be “Hindi7 / Narad Bold”. The lettering for
    names of places, streets, and highways on conventional road guide signs shall
    be a combination of lower-case letters with initial upper-case letters which would
    facilitate easy comprehending of the communicated messages on the signs by the
    road user. The design principles are presented pictorially in Fig. 16.01 to 16.16.
    All messages, borders, and legends shall be retro-reflective and all background
    shall be retro-reflective.'
- intent: advance_direction_signs
  examples: '- Advance Direction Signs'
- intent: the_sign_indicates_the_routes
  examples: '- The sign indicates the routes ahead by showing the names of particular
    places with arrow symbols indicating directions. If desired, distance of places
    in km may be shown after the destination names. If more than one place is to be
    shown in the same direction, the names of the places may be grouped and a single
    arrow used for direction indication. Names/ Group of names of places be separated
    by a line as shown in Fig. 16.01. These are called as stack type sign. On high
    speed roads where the junctions are complex in layout, large size signs (map type
    signs) shown in Fig.'
- intent: 16.02_may_be_employed._in
  examples: '- 16.02 may be employed. In situation where rotary (roundabout) inter-section
    exists, signs as shown in Fig. 16.03 may be employed. The signs can be either
    shoulder mounted or cantilever or gantry mounted as per Table 16.1. The sign shall
    normally be located at a distance from the intersection as given in Table 12.1.'
- intent: table_16
  examples: '- Table 16.1: Types of Mounting forms for Direction Signs and Suggested
    usage guidelines'
- intent: advance_direction_signs_shall
  examples: '- Advance Direction Signs shall be for showing directions and destinations
    with arrows, and whenever applicable can be with route numbers (with icons) and
    distances also. Junction name panel can be added at the top of the advance direction
    signs. Additionally, cautionary and regulatory signs like speed limit, height
    limit, tunnel ahead etc., and NH, SH and Other Route Marker signs can be inscribed
    along with the destination names as shown in Fig. 16.01a.'
