- intent: the_common_principles_to_be_ob
  examples: '- The common principles to be observed while designing shoulder and gantry
    mounted direction signs are given in the subsection below and the specific principles
    for different type of direction board are given under respective subsections.
    The common principles for design of direction boards (Fig. 16.01 to 16.16) are:'
- intent: the_height_mentioned_in_table
  examples: '- The height mentioned in Table 12.1 refers to the height of lower case
    "x" and upper case shall be 1.4 times of lower case "x" height.'
- intent: the_design_pattern_shown_in_fi
  examples: '- The design pattern shown in Figs. 16.01 to 16.16 expressed the design
    of layout of direction sign in terms of stroke width and "x" height. Stroke width
    (s/x) shall be¼ of lower case "x" height.'
- intent: all_place_names_on_a_sign_shal
  examples: '- All place names on a sign shall be in letters of the same size, regardless
    of the relative importance of the place name. A smaller letter size may only be
    used for a name which is too long to fit into a reasonable sized sign and which
    cannot be hyphenated or abbreviated.'
- intent: letters_are_generally_placed_i
  examples: '- Letters are generally placed in an imaginary tile of 2 times "x" height
    i.e. 8 s/w height and the placement of English lettering is pictorially presented
    in Fig. 16.01 whereas as Hindi lettering shall be placed within 2 times "x" height
    i.e. within 8 s/w height.'
- intent: related_words_on_the_same_line
  examples: '- Related words on the same line shall be separated by 1 ½ s/w.'
- intent: route_letters_and_route_number
  examples: '- Route letters and route number shall be separated by 1 ½ s/w.'
- intent: route_letters_shall_be_2_s/w_a
  examples: '- Route letters shall be 2 s/w away place name when on same line.'
- intent: there_shall_be_3_s/w_spaces_be
  examples: '- There shall be 3 s/w spaces between a route number and a bracketed
    route number on same line.'
- intent: the_border_shall_be_1_½_s/w_wi
  examples: '- The border shall be 1 ½ s/w wide.'
- intent: internal_corner_radius_of_oute
  examples: '- Internal corner radius of outer border shall be 2 s/w and other internal
    radius shall be 1 s/w'
- intent: within_panel,_the_borders_shal
  examples: '- Within panel, the borders shall be separated from the top and sides
    of imaginary tile by 2 ½ s/w and on bottom by 1 ½ s/w.'
- intent: for_gantry_mounted_directions
  examples: '- For gantry mounted directions signs, the number of destination names
    above a single carriageway lane shall be limited to only one.'
- intent: for_inclusion_of_cautionary_an
  examples: '- For inclusion of Cautionary and Regulatory Signs inside the direction
    informatory boards, the standard sizes of signs as prescribed in Table 14.4, 14.6
    and 15.1 shall'
- intent: be_placed_between_the_destinat
  examples: '- be placed between the destination name tiles and arrows with a minimum
    clearance of 2.5 s/w from all sides.'
- intent: the_distance_to_the_destinatio
  examples: '- The distance to the destinations may also be placed centred in between
    the destination name tiles and arrow markings with a spacing of 2.5 s/w from the
    edges.'
- intent: in_addition_to_the_common_prin
  examples: '- In addition to the common principles laid out in this section, the
    specific principles for design of different types of signs are given in following
    sections:'
