- intent: x_5
  examples: '- x 5.7 "S" is the off-set distance from the centre of the driving lane
    to the centre of the sign. This is measured from the centre of the right-hand-most
    lane on a dual carriageway. "R" is the distance travelled while reading the sign.
    Distance (R) = Reading Time x Speed.'
- intent: reading_time_=_2_+_(n/3)_secon
  examples: '- Reading time = 2 + (N/3) seconds; where N is the number of words or
    destinations on the sign. When N equals 6 the reading time is taken as 4 seconds.
    The typical values are given Table VI.1 for different conditions. It allows driver
    to scan the sign twice to assimilate the information. The sign may be obscured
    for part of the time by virtue of other vehicles and the driver still needs to
    pay attention to the road ahead. The x-height of the sign depends on the distance
    of the driver from the sign when he starts to read it. It is taken that, on average
    at a distance of 60 meters, the X height should be 110 mm and proportionately
    at 30 metres, the X-height would be 55 mm. From the first principle, the "X" heights
    have been determined for various categories of Indian roads, which are given in
    Table VI.2 to VI.3.'
