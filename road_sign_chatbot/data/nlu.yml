  examples: '- Right / Left Hairpin Bend'
- intent: the_sign_should_be_used_to_mar
  examples: '- The sign should be used to mark curves of small radii, where the change
    of direction is so considerable as to amount to a reversal of direction. The symbol
    should bend to left or right according to the road alignment (Fig. 15.03 & 15.04).'
- intent: right_/_left_reverse_bend
  examples: '- Right / Left Reverse Bend'
- intent: the_sign_should_be_erected_whe
  examples: '- The sign should be erected where two curves in opposite direction are
    separated by a tangent less than 120 m in length in plains and 30 m in hills.
    The sign may also be erected where in the opinion of the controlling authority,
    the nature of the reverse bend is not obvious to approaching drivers and constitutes
    a hazard. If the first curve is to the right, a right reverse bend sign shall
    be used. If the first curve is to the left, a left reverse bend sign shall be
    used (Fig. 15.05 & 15.06).'
- intent: series_of_bends
  examples: '- Series of Bends'
- intent: this_sign_should_be_used_to_ca
  examples: '- This sign should be used to caution the driver of the presence of zig-zag
    for a long distance over the section of road ahead. The sign may be posted 50
    - 100 m ahead of the section under consideration. The sign may be repeated at
    appropriate intervals if the zig-zag road is long (Fig. 15.07). Further, it is
    essential to fortify entire curve with the applicable type of Chevron Sign i.e.
    Single or Double Chevron Signs based on the radii of the curve as per the spacing
    given in Section 15.65.'
- intent: 270_degree_loop
  examples: '- 270 Degree Loop'
- intent: the_sign_shall_be_used_to_caut
  examples: '- The sign shall be used to caution the vehicles about 270 Degree sharp
    loop. The sign shall be placed at the beginning of such area. (Fig. 15.08)'
- intent: side_road
  examples: '- Side Road'
- intent: the_sign_should_be_erected_(fi
  examples: '- The sign should be erected (Fig. 15.09 and 15.10) in advance of the
    main road intersections where in the opinion of the controlling authority, a sufficiently
    large volume of entering traffic together with restricted sight distance is likely
    to constitute a hazard. The sign should only be used when the drivers need to
    be warned of the existence of a junction and no other indication, e.g., by an
    advance direction sign or traffic signal is given.'
- intent: y-intersection
  examples: '- Y-Intersection'
- intent: the_sign_should_be_erected_on
  examples: '- The sign should be erected on the approach to a bifurcation of any
    road. This sign should only be used when the driver needs to be warned of the
    existence of a junction and no other indication, e g., by an advance direction
    sign or traffic signal, is given (Figs. 15.11, 15.12 & 15.13).'
- intent: cross_road
  examples: '- Cross Road'
- intent: the_sign_should_be_erected_in
  examples: '- The sign should be erected in advance of the cross road where in the
    opinion of the controlling authority, a sufficiently large volume of crossing
    or entering traffic'
- intent: together_with_restricted_sight
  examples: '- together with restricted sight distance is likely to constitute a hazard.
    This sign should only be used when the drivers need to be warned of the existence
    of an intersection and no other indication, e.g., by an advance direction sign
    or traffic signal, is given (Fig. 15.14)'
- intent: roundabout
  examples: '- Roundabout'
- intent: the_sign_should_be_used_where
  examples: '- The sign should be used where it is necessary to indicate the approach
    to a roundabout and adequate warning is not conveyed by a map type advance direction
    sign (Fig. 15.15).'
- intent: traffic_signals
  examples: '- Traffic Signals'
- intent: this_sign_can_be_used_to_cauti
  examples: '- This sign can be used to caution the drivers of the presence of traffic
    signals at either of the following two conditions. Such sign shall be posted near
    a critical signalized intersection on rural highways (where provision of traffic
    signal is a rarity) or also at locations where the visibility of signal is obscured
    for a distance (refer Table 15.1) to permit the road user to respond in urban
    areas (Fig. 15.16).'
- intent: t-intersection
  examples: '- T-Intersection'
- intent: major_road_ahead
  examples: '- Major Road Ahead'
- intent: staggered_intersection
  examples: '- Staggered Intersection'
- intent: the_sign_should_be_used_to_ind
  examples: '- The sign should be used to indicate junctions where the distance between
    two junctions does not exceed 60 m. This sign should only be used when the driver
    needs to be warned of the existence of a junction and no other indication, e.g.,
    by an advance direction sign or traffic signal, is given (Figs. 15.20 & 15.21).'
- intent: merging_traffic_ahead
  examples: '- Merging Traffic Ahead'
- intent: this_sign_is_posted_in_situati
  examples: '- This sign is posted in situations where the traffic from other road
    is merging and the drivers are required to slow down their vehicles for safe travel
    (Fig. 15.22). In special cases of interchanges, there can be merging from the
    right hand side also, for which appropriate sign shall be used as shown in Fig.
    15.22a.'
- intent: narrow_road_ahead
  examples: '- Narrow Road Ahead'
- intent: road_widens
  examples: '- Road Widens'
- intent: narrow_bridge_ahead
  examples: '- Narrow Bridge Ahead'
- intent: steep_ascent
  examples: '- Steep Ascent'
- intent: the_sign_should_be_used_30_m_b
  examples: '- The sign should be used 30 m before a steep upgrade where the erecting
    authority considers that the steepness of the upgrade warrants a warning to the
    road users. A gradient of 10 percent and above may be considered steep gradient
    for this purpose. The sign should not be used unless the gradient continues for
    a length of about 500 m to 1 km. It should be repeated at suitable intervals in
    the stretch having the steep ascent (Fig. 15.26).'
- intent: steep_descent
  examples: '- Steep Descent'
- intent: reduced_carriageway
  examples: '- Reduced Carriageway'
- intent: this_sign_is_used_to_caution_t
  examples: '- This sign is used to caution the driver of the reduction in the width
    of the carriageway ahead. This is applicable to undivided carriageway when some
    portion of the carriageway is closed or reduced for maintenance or repairs (Figs.
    15.28 & 15.29).'
- intent: start_of_dual_carriageway
  examples: '- Start of Dual Carriageway'
- intent: this_sign_is_posted_when_a_sin
  examples: '- This sign is posted when a single carriageway ends up into dual carriageway.
    The sign may be posted at a distance of 100 m from the start of dual carriageway
    (Fig. 15.30).'
- intent: end_of_dual_carriageway
  examples: '- End of Dual Carriageway'
- intent: this_sign_is_posted_when_dual
  examples: '- This sign is posted when dual carriageway is ending and single carriageway
    is starting. The sign may be posted at a distance of 100 to 150 m from the end
    of dual carriageway (Fig. 15.31).'
- intent: gap_in_median
  examples: '- Gap in Median'
- intent: the_sign_should_be_installed_a
  examples: '- The sign should be installed ahead of a gap in the median of a divided
    carriageway, other than at intersection (Fig. 15.32).'
- intent: pedestrian_crossing
  examples: '- Pedestrian Crossing'
- intent: 15.33_+_supplementary_plate_indicating
  examples: '- 15.33 + Supplementary plate indicating “10 m” or “20 m”.'
- intent: school_ahead
  examples: '- School Ahead'
