- intent: the_standard_distances_at_whic
  examples: '- The standard distances at which Advance Direction sign would be sited
    are shown in Table 12.1. This shall be applicable for expressways or highways
    with major interchanges. However, if the distance between two successive junctions
    is less than 1 Km which is a common phenomenon in most of the urban areas in the
    country), only Advance direction sign shall be used.'
- intent: for_grade_separated_intersecti
  examples: '- For grade separated intersections, i.e. where the traffic movement
    occurs on two or more than two levels, two or three advanced direction signs should
    be provided. The first Advance Direction sign is located 750m to 1.5km from the
    exit, which should be preferably gantry mounted sign. The second advance direction
    sign is located 250m to 750m from the exit. It should be gantry mounted; but at
    intersections where the number of through lanes remains constant, it may be shoulder
    mounted. Additionally, a map type and stack type direction sign shall be installed
    at 100m to 250m ahead of exit (Fig. 16.14).'
- intent: stack_type_advance_direction_s
  examples: '- Stack type advance direction sign'
- intent: stack_type_signs_are_intended
  examples: '- Stack type signs are intended for use only at simple junctions and
    should not indicate more than three directions as the sign would then become difficult
    to read'
- intent: both_the_arrow_and_the_panel_a
  examples: '- Both the arrow and the panel are centered vertically on the sign'
- intent: arrows_may_be_vertical_or_hori
