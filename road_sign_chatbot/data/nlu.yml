  examples: '- Map type of sign is designed based on the junction configuration and
    geometry. However, it shall be modified in terms of shape and composition for
    increasing the clarity and aesthetics.'
- intent: in_a_roundabout_junction_sign,
  examples: '- In a roundabout junction sign, the recommended minimum angle for cut-out
    is 25º. The purpose of the cut-out is to emphasize that all traffic must travel
    in a clockwise direction.'
- intent: where_a_roundabout_is_offset_f
  examples: '- Where a roundabout is offset from the main direction of travel, it
    may be appropriate to show a curved approach arm on the advanced direction sign.'
