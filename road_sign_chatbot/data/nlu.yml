- intent: reinforcing_steel_shall_confor
  examples: '- Reinforcing steel shall conform to the requirements of Indian Standards
    (IS:1786) unless otherwise specified.'
- intent: bolts,_nuts_and_washers
  examples: '- Bolts, Nuts and Washers'
- intent: high_strength_bolts_shall_conf
  examples: '- High strength bolts shall conform to IS1367 whereas precision bolts,
    nuts, etc. shall conform to IS 1364.'
- intent: plates_and_supports
  examples: '- Plates and Supports'
- intent: plates_and_support_sections_fo
  examples: '- Plates and support sections for the signposts shall conform to IS226
    and IS2062 or any other stated IS specification. Concrete structures shall not
    be used for plates and supports.'
- intent: substrate
  examples: '- Substrate'
- intent: the_substrate_shall_be_either
  examples: '- The substrate shall be either Aluminium sheeting or Aluminium Composite
    Material (ACM) conforming to the following subsections only.'
- intent: aluminium
  examples: '- Aluminium'
- intent: aluminium_sheets_used_for_sign
  examples: '- Aluminium sheets used for sign boards shall be of smooth, hard and
    corrosion resistant aluminium alloy conforming to IS 736 - Material Designation
    24345.'
- intent: aluminium_composite_materials
  examples: '- Aluminium Composite Materials (ACM)'
- intent: acm_sheets_used_for_sign_board
  examples: '- ACM sheets used for sign boards is a sandwiched construction with a
    thermoplastic core of ‘Low Density Polyethylene’ (LDPE) between two thick skins/sheets
    of Aluminium with overall thickness of 4 mm and 3 mm, and Aluminium skin thickness
    of 0.4 - 0.5 mm and 0.25 - 0.3 mm respectively on both sides. The retro reflective
    sheeting must be applied on the top surface with aluminium surface with recommended
    surface preparation from sheeting manufacturer. A fluorocarbon coating may be
    applied over the exposed surface of aluminium to ensure corrosion resistant and
    weatherability and shall conform to relevant American Society for Testing and
    Materials (ASTM). The mechanical properties of 4mm and 3mm ACM and that of its
    Aluminium skin shall conform to the requirement given in Table 6.1, when tested
    in accordance with the test methods mentioned against each of them.'
- intent: plate_thickness
  examples: '- Plate Thickness'
- intent: shoulder_mounted_ground_signs
  examples: '- Shoulder mounted ground signs with a maximum side dimension not exceeding
    600 mm shall not be less than 1.5 mm thick with Aluminium and 3 mm thick with
    Aluminium Composite Material. All other signs shall be at least 2 mm thick with
    Aluminium and 4 mm thick with Aluminium Composite Material. The thickness of the
    sheet shall be related to the size of the sign and its support and shall be such
    that it does not bend or deform under prevailing wind and other loads. All overhead
    signs made with Aluminium Composite Material shall be minimum 4 mm thick to withstand
    wind and other loads without deformation.'
- intent: table_6
  examples: '- Table 6.1: Specifications for Aluminium Composite Material (ACM)'
- intent: retro_reflective_sheeting
  examples: '- Retro Reflective Sheeting'
- intent: the_retro_reflective_sheeting
  examples: '- The retro reflective sheeting used on the signs shall consist of white
    or coloured sheeting having a smooth outer surface which has the property of retro
    reflection over its entire surface. It shall be weather resistant and exhibit
    colour fastness. It shall be new and unused and show no evidence of cracking,
    scaling, and pitting, blistering, edge lifting or curling and shall have negligible
    shrinkage or expansion. A certificate of having the sheeting tested for coefficient
    of retro reflection, daytime colour, colour fastness and luminance, shrinkage,
    flexibility, liner removal, adhesion, impact resistance, specular gloss and fungus
    resistance, nighttime colour, 3 years outdoor weathering and its having passed
    these tests shall be obtained from International / Government Laboratory / Institute
    by the manufacturer of the sheeting and in case the certificate is obtained from
    international agency, it should also be obtained from Indian agency within 3 years
    of launching of product by the manufacturer including actual outdoor weathering
    in Indian conditions. Alternatively, a certificate conforming to ASTM: D4956 specification
    on artificial accelerated weathering requirements from a reputed laboratory in
    India can be accepted provisionally. In such a situation, the Employer/ Client,
    if so desires, could seek for a performance guarantee which would be released
    after the receipt of certificate meeting the requirement of three years outdoor
    weathering of the sheeting. Retro reflective sheeting is divided into three classes
    as follows:'
- intent: class_a_sheeting:_-_engineerin
  examples: '- CLASS A Sheeting: - Engineering and Super Engineering Grade Sheeting
    as per ASTM: D4956 Type I and II.'
- intent: class_b_sheeting:_-high_intens
  examples: '- CLASS B Sheeting: -High Intensity and High Intensity Prismatic Grade
    Sheeting asper ASTM: D4956 Type III and IV.'
- intent: class_c_sheeting:_-_all_micro
  examples: '- CLASS C Sheeting: - All Micro Prismatic Grade Sheeting as per ASTMD
    D4956 Type VIII, IX and XI.'
- intent: selection_of_sheeting
  examples: '- Selection of Sheeting'
- intent: the_performance_characteristic
  examples: '- The performance characteristics of sheeting Type I to Type XI used
    for road signs are presented in Table 6.3 to Table 6.9. The definition of key
    words in understanding the performance characteristics are given below.'
- intent: retro-reflection_means_the_ref
  examples: '- Retro-reflection means the reflection of light which is returned in
    directions close to the direction from which it came and this property being maintained
    even over wide variations of the direction of the incident radiation:'
- intent: observation_angle_(α)_is_the_a
  examples: '- Observation angle (α) is the angle between the illumination axis and
    the observation axis as shown in Figure 6.1.'
- intent: figure_6
  examples: '- Figure 6.1: Description of Observation Angle'
- intent: entrance_angle_(β)_means_the_a
  examples: '- Entrance angle (β) means the angle from the illumination axis to the
    reference axis. The reference axis is an axis perpendicular to the retro-reflective
    surface as shown in Figure 6.2.'
- intent: coefficient_of_retro-reflectio
  examples: '- Coefficient of retro-reflection R'' is obtained from the luminous intensity
    (I) of the retro-reflective area in the direction of observation and the illuminance
    (Ev) on the retro-reflective plane at right angles the direction of the incident
    light and the illuminated plane sample surface A as given Eq. 6.1.'
- intent: formula_retro_reflection
  examples: 'R′ = I / Ev * A (6.1)'
- intent: explain_retro_reflection_coefficient
  examples: 'where: R′ is coefficient of retro-reflection expressed in candela per square meter per lux (cd·m⁻²·lx⁻¹)'
- intent: though_the_sheeting_as_per_ast
  examples: '- Though the sheeting as per ASTM classification are available from Type
    I to Type XI, a “higher” type of sheeting used in the ASTM need not necessarily
    imply that it is better than a "lower"-type sheeting, rather it meets different
    performance characteristics. Each type of sheeting has certain performance characteristics
    and the type of sheeting for a road should be selected which suits the situation
    encountered by road users in viewing the signs on the particular road. For example,
    sheeting with high coefficient of retro reflection at small observation angle
    will give better performance for driver’s viewing the sign from long distances.
    Similarly, signs with wide observation angle give good performance for drivers
    encountering situations to observe the signs at short range distances. Thus, Class
    C Micro prismatic sheeting shall be preferred for the major category of roads
    like Expressways, National / State Highways and Urban Roads. Moreover, Type XI
    sheeting with observation angle of up to 10 shall be preferred while choosing
    Class C grade sheeting applications as it offers good visibility from short and
    medium range distances. Type IV micro prismatic sheeting may be used for delineator
    posts.'
- intent: for_work_zone,_type_iv_can
  examples: '- # - for Work Zone, Type IV can be used'
- intent: optional:_can_be_used_base
  examples: '- $ - Optional: can be used based on site requirements'
- intent: class_a_(engineering_grade_she
  examples: '- Class A (Engineering Grade Sheeting)'
- intent: type_i_engineering_grade_sheet
  examples: '- Type I Engineering Grade Sheeting'
- intent: this_sheeting_shall_be_of_encl
  examples: '- This sheeting shall be of enclosed lens glass bead type consisting
    of microscopic lens elements embedded beneath the surface of a smooth, flexible,
    transparent, water-proof plastic, resulting in a non-exposed lens optical reflecting
    system. The retro-reflective surface after cleaning with soap and water and in
    dry condition shall have the minimum coefficient of retro-reflection determined
    in accordance with ASTM: D 4956 which is indicated in Table 6.3.'
- intent: at_the_end_of_5_years,_the_she
  examples: '- At the end of 5 years, the sheeting shall retain at least 50 percent
    of the retro- reflectance values given in Table 6.3.'
- intent: type_ii_super_engineering_grad
  examples: '- Type II Super Engineering Grade Sheeting'
- intent: class_b_(high_intensity_grade
  examples: '- Class B (High Intensity Grade Sheeting)'
- intent: type_iii_high_intensity_grade
  examples: '- Type III High Intensity Grade'
- intent: this_high_intensity_retro-refl
  examples: '- This high intensity retro-reflective sheeting shall be of encapsulated
    lens type consisting of spherical glass lens, elements adhered to a synthetic
    resin and encapsulated by a flexible, transparent waterproof plastic having a
    smooth surface or as an unmetallized micro prismatic reflective material element.
    The retro-reflective surface after cleaning with soap and water and in dry condition
    shall have the minimum co-efficient of retro-reflection (determined in accordance
    with ASTM: D4956) as indicated in Table 6.5.'
- intent: at_the_end_of_7_years,_the_she
  examples: '- At the end of 7 years, the sheeting shall retain at least 80 percent
    of the retro- reflectance values given in Table 6.5.'
- intent: minimum_coefficient_of_retro_r
  examples: "- Minimum Coefficient of Retro reflection (RA) (cd.lx-1.m-2).\t(Source:\
    \ ASTM: D4956)"
