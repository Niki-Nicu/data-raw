- intent: two_way_traffic_on_cross_road
  examples: '- Two Way Traffic on Cross Road Ahead'
- intent: lane_closures
  examples: '- Lane Closures'
- intent: traffic_diversion_on_dual_carr
  examples: '- Traffic Diversion on Dual Carriageway'
- intent: this_sign_is_used_to_warn_the
  examples: '- This sign is used to warn the driver of the diversion of traffic from
    one carriageway to the other. Mostly it is used on dual carriageway when one carriageway
    is closed for maintenance or due to an incident (Fig. 15.41).'
- intent: people_at_work
  examples: '- People at Work'
- intent: the_sign_should_be_displayed_o
  examples: '- The sign should be displayed only when people or machines are working
    on the road or adjacent to it or on overhead lines or poles. The background colour
    of the sign shall'
- intent: be_yellow_as_per_irc:_sp-55
  examples: '- be yellow as per IRC: SP-55. The sign should be removed immediately
    after the work is completed (Fig. 15.42). The sign is generally located on the
    approach side of the work zone or area and another sign with supplementary plate
    “END” shall be provided at the leaving side of the work zone where traffic reverts
