  examples: '- Junction Reference point: The distance in advance of junction at which
    Advance Direction signs should be sited is measured from the junction reference
    point. The reference point is defined below.'
- intent: in_the_case_of_interchange,_th
  examples: '- In the case of Interchange, the point at which carriageway widens to
