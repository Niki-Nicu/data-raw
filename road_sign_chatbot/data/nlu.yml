- intent: dangerous_dip
  examples: '- Dangerous Dip'
- intent: speed_breaker
  examples: '- Speed Breaker'
- intent: this_sign_should_be_used_to_wa
  examples: '- This sign should be used to warn the drivers of the presence of the
    speed breaker. This sign should be posted at a minimum distance of 50 to 60 m
    in advance of the speed breaker location (Fig. 15.51). If required, the sign shall
    be repeated at a short distance ahead of the speed breaker, indicating the distance
    to the speed breaker with a supplementary plate, i.e. Fig 15.49 + Supplementary
    plate indicating “10 m” or “20 m”. Such speed breakers should be constructed at
    the identified crash prone locations.'
- intent: rumble_strip
  examples: '- Rumble Strip'
- intent: the_sign_should_be_posted_at_a
  examples: '- The sign should be posted at a minimum distance of 50 to 60 m in advance
    of the rumble strips provided on the road to control and reduce the speed. This
    is to warn the drivers of the presence of the rumble strips (Fig. 15.50). If required,
    the sign shall be repeated at a short distance ahead of the rumble strips, indicating
    the distance to the rumble strip with a supplementary plate, i.e. Fig 15.50 +
    Supplementary plate indicating “10 m” or “20 m”. Such rumble strips should be
    constructed at the identified crash prone locations.'
- intent: rough_road
  examples: '- Rough Road'
- intent: soft_verges
  examples: '- Soft Verges'
