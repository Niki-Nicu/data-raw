- intent: the_speed_limit_sign_in_cities
  examples: '- The speed limit sign in cities shall be placed on each of the roads
    where the speed changes or on the exit arms of the junctions. The vehicles travelling
    through a major junction are reassured about the speed limit on the new road by
    placing a speed limit sign within a maximum distance of 100 m from the intersection.
    The distance can be further increased by another 100 m in case of existence of
    bus bay or any another form of space constraints. The size of speed limit signs
    (the first sign indicating the changed speed on major road after crossing the
    junction) shall be 600 mm, except for the dual carriageway roads with speed limit
    of 50 Kmph or more, where the sign size shall increase to 900 mm. The repeater
    sign shall be placed on urban roads at interval given in Table 14.5.'
