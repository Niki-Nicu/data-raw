  examples: '- Expressways'
- intent: national_highways
  examples: '- National Highways'
- intent: state_highways
  examples: '- State Highways'
- intent: major_district_roads
  examples: '- Major District Roads'
- intent: rural_roads_[other_district_ro
  examples: '- Rural Roads [Other District Roads (ODR) and Village Roads(VR)]'
- intent: urban_(city)_roads
  examples: '- Urban (City) Roads'
- intent: the_colour_combinations_for_di
  examples: '- The colour combinations for direction information signs for different
    categories of road shall be as given in Table 8.3.'
- intent: siting_of_signs_with_respect_t
  examples: '- Siting of Signs with respect to the Carriageway'
- intent: the_road_signs_are_the_means_o
  examples: '- The road signs are the means of communication to the road users, especially
    drivers. Therefore, the signs shall be so placed that the drivers can recognize
    them easily and in time. Normally the signs shall be placed on the left hand side
    of the road. For two lane roads, normally the signs may be placed on the left
    side of the carriageway, repeated on the other side of the carriageway, if local
    conditions are such that the signs might not be seen in time by the drivers. For
    multilane divided roads the signs may be placed on the left side of each carriageway.
    In case of hill roads, the signs shall generally be installed on the valley side
    of the road, unless traffic and road conditions warrant these to be placed on
    the hill side.'
- intent: on_all_roads_with_or_without_k
  examples: '- On all roads with or without kerb and with shoulder, the extreme edge
    of the ground mounted sign adjacent to the roadway shall be at a distance of 600
    mm to 3 m from the edge of the earthen shoulder depending upon the available Right
    of Way. For roads without shoulder, a minimum clearance of 1m from roadway edge
    shall be provided. For roads with kerbs, it shall not be less than 300 mm away
    from kerb line, but in no case shall any part of the sign act as an obstruction
    to vehicular traffic or acting as an obstacle hindering movement of pedestrians
    on the footpath.'
- intent: gantry_mounted_signs_should_be
  examples: '- Gantry mounted signs should be mounted on columns preferably 7m or
    more from the nearest traffic lane, unless otherwise specified. The minimum lateral
    offset is intended to keep it away from vehicles that may use the shoulder striking
    the gantry column. If there is a situation where this lateral clearance cannot
    be maintained, the column of gantry sign shall be shielded with W-Beam crash barrier
    for required run out length depending upon the setback distance between the pavement
    edge line and column of gantry. Clearance distance not less than 1.8 m, shall
    be used on connecting roadways or ramps at interchanges.'
- intent: on_kerbed_roads,_the_bottom_ed
  examples: '- On kerbed roads, the bottom edge of the lowest sign shall not be less
    than 2.1 m and not more than 2.5 m above the kerb. On roads without kerb, the
    bottom edge of the lowest sign shall not be less than 2 m and not more than 2.5
    m above the crown of the pavement. Where signs are erected above footpaths or
    in areas likely or intended to be used by pedestrians, minimum headroom of 2.1
    m is to be provided.'
- intent: where_in_the_opinion_of_the_co
  examples: '- Where in the opinion of the competent authority, a sign would be ineffective
    if placed on the left hand side shoulder of a road with dual carriageway, it may
    be placed on the median instead. To improve the visibility of the signs on multi-lane
    roads, the minimum height of the lower edge of the sign should be kept as 2.5
    m above the highest point of the carriageway.'
- intent: the_signs_shall_be_so_placed_t
  examples: '- The signs shall be so placed that these do not obstruct vehicular traffic
    on the carriageway, and if placed on the berm/ footpath/ refuge island should
    allow'
- intent: unhindered_movement_of_pedestr
  examples: '- unhindered movement of pedestrians. The difference in level between
    the lower edge of the sign and the carriageway shall be as uniform as possible
    for signs of the same class on the same route.'
- intent: on_multi-lane_roads,_the_signs
  examples: '- On multi-lane roads, the signs may have to be mounted overhead, as
    this would ensure better visibility and be effective in communicating with the
    drivers and other road users. Overhead signs may be used in lieu of, or as an
    adjunct to, ground signs where the situation so warrants for proper information
    and guidance of the road user. The following conditions may be considered while
    deciding about the provision of overhead signs:'
- intent: traffic_volume_at_or_near_capa
  examples: '- Traffic volume at or near capacity'
- intent: complex_interchange_design
  examples: '- Complex interchange design'
- intent: three_or_more_lanes_in_each_di
  examples: '- Three or more lanes in each direction'
- intent: restricted_visibility
  examples: '- Restricted visibility'
- intent: high_speed_traffic
  examples: '- High speed traffic'
- intent: insufficient_space_for_ground
  examples: '- Insufficient space for ground mounted signs'
- intent: large_percentage_of_commercial
  examples: '- Large percentage of commercial vehicles'
- intent: closely_spaced_interchanges
  examples: '- Closely spaced interchanges'
- intent: from_safety_and_aesthetic_stan
  examples: '- From safety and aesthetic standpoints, overhead signs shall be mounted
    on overhead bridge structures, wherever possible. Overhead signs shall provide
    a vertical clearance of not less than 5.5 m over the entire width of the pavement
    and shoulders. Where overhead sign supports cannot be placed at a safe distance
    away from the line of traffic or in an otherwise protected site, they should either
    be so designed as to minimize the impact forces or protect motorists adequately
    by the mandatory provision of a crash barrier or guard rail of suitable design.
    Encompassing all the above requirements, the siting of signs with respect to carriageway
    with required height and clearance is given in Table 4.1 and Figure 4.1.'
- intent: mandatory_signs_(e
  examples: '- Mandatory signs (e.g. Keep Left) on traffic islands are normally mounted
    so that the bottom edge is about 1000 mm above the paved surface. The same mounting
    pattern can be followed for street name boards which don’t obstruct the movement
    of pedestrians (due to the parallel placement). When several signs have to be
    placed along the same section of road, take care that they do not obscure each
    other. Care shall be exercised to locate two successive signs at a minimum distance
    of 0.6*V metres apart (where V is design speed in Kmph) in the case of interurban
    roads, whereas for urban roads, a minimum distance of 20 m between two successive
    road signs shall be maintained. Signs are normally erected on the left side of
    the road, but for extra emphasis (like high traffic volume, critical locations,
    etc.), a second sign shall be placed on the right side of the road or on the median
    in the case of multilane divided carriageways. Such placement of additional sign
    on the median is especially useful to delineate left-hand curves using the ‘Curve
    Ahead Sign’ and similarly placement of additional sign for pedestrian crossings
    on median near school zones with emphasis on safety of vulnerable users. Wherever
    minimum lateral clearance cannot be maintained for gantry columns from shoulder
    edge line, such exposed column shall be protected with crash barrier.'
- intent: table_4
  examples: '- Table 4.1: Heights and Clearances required for Sign Placement'
- intent: figure_4
  examples: '- Figure 4.1: Typical Siting of Signs with respect to Carriageway (Heights
    and Clearances)'
- intent: refer_table_4
  examples: '- (Refer Table 4.1 for values)'
- intent: orientation_of_signs
  examples: '- Orientation of Signs'
- intent: the_signs_unless_otherwise_sta
  examples: '- The signs unless otherwise stated shall normally be placed at right
    angles to the line of travel of the approaching traffic. Signs relating to parking,
    however, should be fixed  at  an  angle  (approximately)  15o  to  the'
- intent: carriageway_so_as_to_give_bett
  examples: '- carriageway so as to give better visibility.'
- intent: where_light_reflection_from_th
  examples: '- Where light reflection from the sign face is encountered to such an
    extent as to reduce legibility, the sign should be turned slightly away from the
    road as shown in Figure 5.1. On horizontal curves, the sign should not be fixed
    normal to the carriageway, but the angle of placement should be determined with
    regard to the course of the approaching traffic.'
- intent: sign_faces_are_normally_vertic
  examples: '- Sign faces are normally vertical, but on gradients it may be desirable
    to tilt a sign forward or backward from the vertical to make it normal to the
    line of sight and improve the viewing angle.'
- intent: figure_5
  examples: '- Figure 5.1: Sign Orientation with respect to Carriageway'
