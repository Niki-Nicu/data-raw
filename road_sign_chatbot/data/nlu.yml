    height of 180 mm. The shape, size and spacing of letters and numerals shall conform
    to those given in Fig. 21.02.'
- intent: the_sign_shall_be_erected_on_n
  examples: '- The sign shall be erected on National Highway route prior to the major
    intersections and immediately after the major intersections as confirmatory Route
    Markers, at suitable locations through built-up areas, and at such other point
    that may be considered necessary to guide through traffic. The Distance (along
    the National Highway) of the sign from the junction, on either side of it, shall
    be 100 to 150 m. Also, it shall be fixed on the left hand side as one approaches
    the junction.'
- intent: asian_highway_route_marker_sig
  examples: '- Asian Highway Route Marker Sign'
- intent: the_asian_highway_route_marker
  examples: '- The Asian Highway Route Marker Sign shall consist of a shield with
    Retro-Reflective Blue Colour Base and White Symbol and Border on a rectangular
    plate of size 600 mm x 800 mm. The sign consists of the letters ''AH'' (Asian
    Highway) with a font height of 200 mm followed by the number in Arabic numerals
    assigned to the route with a font height of 180 mm. The shape, size and spacing
    of letters and numerals shall conform to those given in Fig. 21.03.'
- intent: the_sign_shall_be_erected_on_a
  examples: '- The sign shall be erected on Asian Highway route prior to the major
    intersections and immediately after the major intersections as confirmatory AH
    Route Markers, at suitable locations through built-up areas, and at such other
    point that may be considered necessary to advise the travelers of the presence
    of the Asian Highways. The distance of these sign posts from the junction along
    the Asian Highway, on either side of it, shall be 150 to 200 m. Also, it shall
    be fixed on the left hand side as one approaches the junction. The sign shall
    be supplemented to the NH, SH or Expressway Route Marker Sign depending upon the
    category of the road that is classified also as part of the Asian Highway network
    within the country.'
- intent: expressway_route_marker_sign
  examples: '- Expressway Route Marker Sign'
- intent: the_expressway_route_marker_si
  examples: '- The Expressway Route Marker Sign shall consist of a shield with Retro-Reflective
    Blue Colour Base and white symbol and border on a rectangular plate of 600 mm
    x 800 mm. The sign consists of the letters ''NE'' (National Expressway) with a
    font height of 200 mm followed by the number in Arabic numerals assigned to the
    route with font height of 180 mm. The shape, size and spacing of letters and numerals
    shall conform to those given in Fig. 21.04.'
- intent: signs_for_expressways
  examples: '- Signs for Expressways'
- intent: an_expressway_is_a_divided_hig
  examples: '- An expressway is a divided highway for high speed traffic with full
    control of access. The signing system for expressways should help road user to
    get clear and progressive direction information to avoid possible inconvenience
    by missing proper entry or exit. Apart from the direction information signs, alignment
    delineation signing and hazard adjacent to high speed traffic are important while
    considering signing for expressway. As the Vulnerable Road Users (VRU) like pedestrians
    and cyclist are not present on the expressway, the signs related to VRUs are not
    required in the main alignment.'
- intent: signs_are_designed_so_that_the
  examples: '- Signs are designed so that they are legible to road users approaching
    them and can be read in time to permit proper responses. Desired design characteristics
    include: (a) long visibility distances, (b) large lettering and symbols, and (c)
    short legends for quick comprehension.'
- intent: colour_of_signs
  examples: '- Colour of Signs'
- intent: the_colour_of_all_type_of_sign
  examples: '- The colour of all type of signs except direction informatory sign shall
    be same as given in Plate-I and Plate-II whereas for direction information signs,
    it shall be white lettering, border and arrows on blue background. In case of
    Facility signs, black symbol is displayed within white square in blue background.'
- intent: format_of_legends_on_overhead
  examples: '- Format of Legends on Overhead and Shoulder Mounted Signs'
- intent: the_legend_on_all_signboards_s
  examples: '- The legend on all signboards shall be bilingual- regional/local language
    and English except on those signboards located at entry and exit points of expressways.
    Entry/Exit shall have inscriptions in regional/local language, Hindi and English.
    The font type shall be as per Table 23.1.'
- intent: table_23
  examples: '- Table 23.1: Font Type for Inscription in Expressway Signs'
- intent: warrants_for_sign_installation
  examples: '- Warrants for Sign Installation'
- intent: the_siting_of_regulatory_and_w
  examples: '- The Siting of regulatory and warning signs shall follow the guidelines
    mentioned in respective sections. Distances of installation shall be based on
    the speeds and clear visibility distance as mentioned in Table 12.1.'
- intent: sizes_of_the_signs
  examples: '- Sizes of the Signs'
- intent: sizes_of_the_signs_should_be_d
  examples: '- Sizes of the signs should be decided based on the prevailing speeds
    on the type of the roads as shown in Table 23.2.'
- intent: siting_of_the_signs_with_respe
  examples: '- Siting of the signs with respect to Carriageway'
- intent: generally,_siting_of_the_signs
  examples: '- Generally, siting of the signs shall be as per the details given in
    Section 4.'
- intent: size_of_letters_should_be_as_p
  examples: '- Size of letters should be as per Table 12.1. Normally, sign size is
    determined by the length of the message and size of the letters necessary for
    proper legibility.'
- intent: for_supplementary_plates_attac
  examples: '- For supplementary plates attached with facility signs, regulatory signs
    or cautionary signs the recommended letter size shall be as per Table 12.1. The
    text added with some of the regulatory signs for information like timings “9:00
    AM to 8:00 PM”, dates or days can be in 100 - 125 mm letter size.'
- intent: guidelines_for_informatory_sig
  examples: '- Guidelines for Informatory Signs Installation'
- intent: general_guidelines_given_in_se
  examples: '- General guidelines given in Sections 1 to 22 as relevant for informatory
    signs shall apply except for the following signs.'
- intent: direction_signs
  examples: '- Direction signs'
- intent: the_direction_signs_should_be
  examples: '- The Direction signs should be either gantry or shoulder mounted. These
    signs shall be used for grade separated Entry and Exit to the expressways. Advance
    Direction signs should be placed normally at 500 m, 1 km and at 2 km in advance
    of the exit.'
- intent: exit_direction_signs
  examples: '- Exit direction signs'
- intent: the_exit_direction_sign_repeat
  examples: '- The Exit Direction sign repeats the route and destination information
    that was shown on the Advance Information sign(s) for the next exit, and thereby
    assures road users of the destination served and indicates whether they exit to
    the left or right for that destination. Shoulder mounted Exit Direction signs
    should be installed at the beginning of the deceleration lane. If there is less
    than 90 m from the beginning of the deceleration lane, the Exit Direction sign
    should be installed overhead over the exiting lane.'
- intent: distance_signs
  examples: '- Distance signs'
- intent: distances_to_the_same_destinat
  examples: '- Distances to the same destinations should be shown at 5 km intervals.
    The distances displayed on these signs should be the actual distance to the destination
    points and not the distance to the exit from the expressway.'
- intent: signs_for_urban_and_city_roads
  examples: '- Signs For Urban and City Roads'
- intent: the_signing_system_for_urban_a
  examples: '- The signing system for urban and city roads should help road user to
    get clear and unambiguous information where there could be many advertisement
    hoardings and road side activities. The signs for Vulnerable Road Users (VRU)
    like pedestrians and cyclists and signs for disabled people would play important
    role in urban and city road signing.'
- intent: the_colour_of_all_types_of_sig
  examples: '- The colour of all types of signs except direction informatory sign
    shall be same as given in Plate-I and Plate-II whereas for direction information
    signs, it shall be white lettering, border and arrows on blue background. In case
    of facility signs, black symbol is displayed within white square in blue background.'
- intent: table_24
  examples: '- Table 24.1: Font Type for Inscription in Signs of Urban/ City Roads'
- intent: the_placement_of_regulatory_an
  examples: '- The placement of regulatory and warning signs shall follow the guidelines
    mentioned in respective sections. Distances of installation shall be based on
    the speeds and clear visibility distance as mentioned in Table 12.1.'
- intent: generally,_placement_of_the_si
  examples: '- Generally, placement of the signs shall be as per Section 4. Where,
    however, site condition demand any deviation, the competent authority may decide
    after due consultation with traffic engineering specialist. In case of space constraints,
    if the clear siting distance between two successive signs i.e. 0.6*V (where V
    is the Design speed) cannot be provided, the distance can be further reduced up
    to 20 m. Mounting of two signs on a single post shall also be considered as an
    alternative.'
- intent: other_direction_signs_and_faci
  examples: '- Other Direction signs and Facility Information Signs'
- intent: signs_like_finger_type_way_fin
  examples: '- Signs like Finger type way finding signs for pedestrians, signs for
    intermediate public transport (IPT) for the pickup and drop zones, signs for mass
    transport (BRT and Metro), signs to promote multimode public transport, street
    name signs and also signs for non-motorized transport shall be part of urban signing
    (Refer Plate-VI, Fig. 24.01 to 24.03). Universal accessibility with international
    symbols to be considered while selecting the signs for Parking, Pedestrian Crossing,
    pickup/drop of points, restrooms etc. As a part of comprehensive footpath design
    and street and road elements, Way finding and guide map signs for visitors and
    tourists shall be given. While developing the cycle tracks and pedestrian walkways
    signs required for it shall be given. Signs indicating loading and unloading bays
    for freight vehicles should be placed. Public and mass transit areas shall be
    provided with clear and consistent way-finding signage to support efficient navigation
    to public transport stations. This includes static information such as route maps,
    route destinations and transfer opportunities.'
- intent: gantry_mounted_signs_given_in
  examples: '- Gantry mounted signs given in Fig. 16.16 are appropriate for locations
    ahead of a flyover in an urban situation.'
- intent: toll_plaza_related_signs
  examples: '- Toll Plaza related Signs'
- intent: these_signs_include_the_inform
  examples: '- These signs include the informatory signs related to the toll plazas
    / toll booths. The normal Regulatory STOP sign shall be installed at the boom
    barrier gates and the bull- nose structures shall be highlighted either with retro
    reflective sheeting or two-way Object hazard markers along with the compulsory
    pass either side sign. The lane dedicated signs for various categories of vehicles
    and Fast tag / Cash lanes present at the toll plaza shall be mounted as canopy
    signs. Advance Lane dedication information for Fast Tag Lanes shall be given along
    with toll plaza ahead informatory signs (overhead cantilever type) posted at 500m
    from Toll plaza location. A typical summary of toll plaza related signages are
    shown in Plate-VII, Fig. 25.01 to 25.04 and Annexure-V, Figure V.13.'
- intent: user_fee_notifications_boards
  examples: '- User Fee Notifications Boards'
- intent: these_include_the_following_bo
