version: '3.1'
nlu:
- intent: 1_transport_planning_and_traff
  examples: '- 1 Transport Planning and Traffic Engineering Committee of the Indian
    Roads Congress in its meeting held on 25th May, 2018 and subsequently it constituted
    a sub- group under the convenorship of Dr. Errampalli Madhu and including Prof.
    Kalaga Ramachandra Rao and Sh. Pawan Kumar Singh as members to review the code
    and suggest modifications/ amendments if any required. The subgroup after deliberations
    co-opted Dr. S. Velmurugan and Sh. Swatantra Kumar as members considering their
    rich experience. The significant help was also retendered by Sh. Pramod Bhaskar
    to the sub-group in preparing the draft code. The subgroup reviewed the code in
    detail and restructured it by relating size and spacing of signs with respect
    to design speed of the road, including guidelines for selection of retro-reflective
    sheeting, incorporating some new signs and including illustrative examples of
    sign plans for different commonly occurring situations. The modified code was
    considered by the H- 1 Transport Planning and Traffic Engineering Committee (Personnel
    given below) in its meeting held on 29th May, 2020 and approved for forwarding
    to IRC for consideration by the Highways Specification and Standards Committee
    after modifications based on comments of the members.'
- intent: the_highways_specifications_an
  examples: '- The Highways Specifications and Standards Committee approved the draft
    in its meeting held on 12th September 2020. The code was modified considering
    the HSS committee suggestions by the H-1 Committee and approved for forwarding
    to IRC for consideration by the Executive Committee. Subsequently the draft was
    ----- by the Executive Committee on   and Council in its meeting held at ----.'
- intent: the_purpose_of_the_road_signs
  examples: '- The purpose of the road signs is to promote road safety and efficiency
    by providing for the orderly movement of all types of road users moving on various
    categories of roads in both urban and non-urban areas. Road signs notify road
    users of regulations and provide warning as well as guidance needed for safe,
    uniform and efficient operation.'
- intent: this_code_contains_the_basic_p
  examples: '- This Code contains the basic principles that govern the design and
    use of road signs for all categories of roads including expressways open to public
    travel irrespective of road agency having jurisdiction. It is important that these
    principles be given primary consideration in the selection and application of
    each road sign.'
- intent: to_be_effective,_a_road_sign_s
  examples: '- To be effective, a road sign should meet five basic requirements:'
- intent: fulfill_a_need;
  examples: '- Fulfill a need;'
- intent: command_attention;
  examples: '- Command attention;'
- intent: convey_a_clear_and_simple_mean
  examples: '- Convey a clear and simple meaning;'
- intent: command_respect_from_road_user
  examples: '- Command respect from road users; and'
- intent: give_adequate_time_for_respons
  examples: '- Give adequate time for response.'
- intent: design,_placement,_operation,
  examples: '- Design, placement, operation, maintenance, and uniformity are aspects
    that should be carefully considered in order to maximize the ability of a road
    sign to meet these five basic requirements.'
- intent: placement_and_operation_of_roa
  examples: '- Placement and Operation of Road Signs'
- intent: placement_of_road_signs_should
  examples: '- Placement of road signs should be within road user’s view. To aid in
    conveying proper meaning, road signs should be positioned with respect to the
    location or situation to which it applies. The location and legibility of the
    road sign should be such as to provide adequate response time to road users to
    read and take action at the operating speed.'
- intent: road_signs_or_their_supports_(
  examples: '- Road Signs or their supports (including front and back) shall not bear
    any form of advertisement or other message that is not related to traffic control.
    However, tourist- oriented directional signs and signs relating to specific wayside
    services and amenities should not be considered as advertising.'
- intent: road_signs_should_be_placed_an
  examples: '- Road signs should be placed and operated in a consistent manner. Road
    signs which are not necessary or no longer required should be removed. The fact
    that a sign is in good physical condition should not be a basis for deferring
    the removal or change, if it is so warranted.'
- intent: maintenance_of_road_signs
  examples: '- Maintenance of Road Signs'
- intent: maintenance_of_road_signs_shou
  examples: '- Maintenance of road signs should be ensured to retain both the legibility
    and the visibility of the sign. Functional evaluation of road signs should be
    done to determine'
- intent: at_regular_periodic_intervals,
  examples: '- at regular periodic intervals, whether certain signs need to be changed
    to meet current traffic conditions. Clean, legible and properly mounted signs
    in good working condition command respect from road users.'
- intent: uniformity_of_road_signs
  examples: '- Uniformity of Road Signs'
- intent: uniformity_of_signs_simplifies
  examples: '- Uniformity of signs simplifies the task of the road user because it
    helps in recognition and understanding, thereby reducing perception/ reaction
    time. Uniformity assists road users, traffic police and highway agencies by giving
    everyone the same interpretation message. Uniformity also promotes efficiency
    in manufacture, installation and maintenance. Uniformity means treating similar
    situations in a similar way. A standard sign, used where it is not appropriate,
    is as objectionable as a nonstandard sign.'
- intent: traffic_engineering_study
  examples: '- Traffic Engineering Study'
- intent: the_decision_to_use_a_particul
  examples: '- The decision to use a particular sign at a particular location should
    be made on the basis of traffic engineering study and after a very careful planning
    so that correct signs are placed at required locations.'
- intent: authorities_with_responsibilit
  examples: '- Authorities with responsibility for traffic control that do not have
    in-house engineering assistance can take help from traffic engineering consultant(s)
    or academic and research institutions with domain expertise.'
- intent: classification_of_road_signs
  examples: '- Classification of Road Signs'
