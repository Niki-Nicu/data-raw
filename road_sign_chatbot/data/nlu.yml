- intent: smart_variable_message_signs_s
  examples: '- Smart Variable Message signs should be able to draw information from
    cloud-based services as well as able to integrate with local road/ground based
    sensors to provide useful information to the motorists. The variable message signs
    should be able to work on standalone basis and show real time information even
    in the event of a failure at the central server / during emergency situations.
    Unlike the late 1990s where variable message signs were simply LED display with
    mostly single colour showing static messages, the present day technology has advanced
    and now these displays are fill coloured with better resolution, capable of displaying
    both text and graphics as per IRC SP:110-2017. Considering these, a VMS shall
    have a full-colour 10 mm pitch LED display having a brightness of 7500-8000 cd/m2with
    CE, FCC, CB, RoHS, EN12966 (Display Parameters) Certifications for better visibility
    and readability. These Intelligent VMS boards shall have the facility to switch
    to Low Power mode screens in case of Mains power failure. Maximum Power consumption
    per cabinets should not exceed 0.4 kW/m2. These screens should be monitored remotely
    for pixel level failure detection via a dashboard at the control room. It shall
    also provide Android and iOS based application for Disaster Management and Emergency
    Messages. This solution proposed should support 128-bit encryption along with
    dongle based access control to ensure secure access and communications with server.
    Apart from Traffic management system, Variable Message Signs can be used at bus
    stops to display the live journey time of buses, can be integrated with other
    ITS solutions to give driver feedback, ensure driver safety and enforce traffic
    rules. A typical VMS is shown in Figure 21.1 which suggests the road users to
    take alternative routes, limit travel speed, warned of duration and location of
    the incident and traffic information.'
- intent: figure_21
  examples: '- Figure 21.1: Typical Variable Message Sign Board VMS'
