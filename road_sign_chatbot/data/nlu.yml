- intent: the_“pass_either_side”_sign_as
  examples: '- The “Pass either side” sign as shown in Fig.14.52 is for use on traffic
    islands, usually in one-way roads, where drivers passing either side of the sign
    reach the same destination immediately ahead. It must not be used in situations
    where drivers would become committed to different destinations once they had passed
    the sign. In this case, a plain-faced bollard or Two-way Hazard Marker (Fig. 15.78)
    should normally be provided. Where flag type direction signs have been erected
    on the traffic islands, it becomes clear without the compulsory direction sign.'
